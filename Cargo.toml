[workspace]
resolver = "2"
members = [
    "crates/purent-ntdef",
    "crates/purent-pe",
    "crates/purent-boot",
    "crates/purent-hal",
    "crates/purent-kernel",
    "crates/apps/smss",
    "xtask",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
